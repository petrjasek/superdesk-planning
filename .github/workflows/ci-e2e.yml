name: "CI-E2E"

on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8']
        node-version: ['14']
        e2e: ['a', 'b']
    env:
      INSTALL_NODE_MODULES: true
      RUN_SERVICES: true
      E2E: true
      TZ: Australia/Sydney
      CYPRESS_SCREENSHOTS_FOLDER: /tmp/cypress
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build server
        run: docker compose build
      - name: Start services
        run: |
          docker compose pull
          docker compose up -d
      - name: Build Client
        run: npm run build
      - name: E2E Suite A
        if: matrix.e2e == 'a'
        run: npm run cypress-ci -- --spec "cypress/e2e/events/*.cy.ts"
      - name: E2E Suite B
        if: matrix.e2e == 'b'
        run: npm run cypress-ci -- --spec "cypress/e2e/!(events)/*.cy.ts|cypress/e2e/workqueue.cy.ts"
      - name: Upload screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v2
        with:
          name: screenshots-e2e-${{ matrix.e2e }}
          path: /tmp/cypress/**/*.png
